name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked --lib

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --lib
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: pcsc-rs-windows-x86_64
          path: target/release/pcsc-rs.exe

  mips:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [mipsel-unknown-linux-musl, mips-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      # Tier 3: no prebuilt std, so nightly + rust-src, built through cross
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross +nightly build --locked --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/pcsc-rs pcsc-rs-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pcsc-rs-${{ matrix.target }}
          path: pcsc-rs-${{ matrix.target }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mips]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
