name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      tag-name:
        description: Release tag to attach the binaries to
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked --lib

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --lib
      - run: cargo build --locked --release
      - run: Copy-Item target/release/pcsc-rs.exe pcsc-rs-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pcsc-rs-windows-x86_64
          path: pcsc-rs-windows-x86_64.exe

  linux:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - mipsel-unknown-linux-musl
          - mips-unknown-linux-musl
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      # MIPS is Tier 3 (no prebuilt std): nightly + rust-src, std built by cross (Cross.toml)
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross +nightly build --locked --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/pcsc-rs pcsc-rs-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pcsc-rs-${{ matrix.target }}
          path: pcsc-rs-${{ matrix.target }}

  release:
    if: ${{ inputs.tag-name != '' }}
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - run: gh release upload "${{ inputs.tag-name }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
