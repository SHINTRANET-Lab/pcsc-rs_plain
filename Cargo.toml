[package]
name = "pcsc-rs-plain"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "pcsc_rs"
path = "src/lib.rs"

[[bin]]
name = "pcsc-rs"
path = "src/main.rs"
required-features = ["client"]

[dependencies]
arc-swap = "=1.9.2"
cfg-if = "=1.0.5"
dotenvy = "=0.15.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# No TLS feature on purpose: this client only speaks ws:// (to a relay on the LAN)
tungstenite = { version = "=0.30.0", features = ["url"], optional = true }
sysinfo = { version = "=0.39.6", default-features = false, features = ["component", "disk", "multithread", "system"] }

[features]
default = ["client"]
client = ["dep:tungstenite"]

[build-dependencies]
git2 = { version = "=0.21.0", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "=0.1.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Wdk_Graphics_Direct3D",
] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "=0.2.190"

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "s"
